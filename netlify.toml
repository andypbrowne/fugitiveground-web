[build]
	publish = "_site"
	command = "npm run build"

[build.environment]
	SITE_URL = "https://fugitiveground.andypbrowne.com"

[[headers]]
	for = "/*"
	[headers.values]
		X-Content-Type-Options = "nosniff"
		Referrer-Policy = "strict-origin-when-cross-origin"
		X-Frame-Options = "DENY"
		Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[redirects]]
	from = "/about"
	to = "/"
	status = 301

[[redirects]]
	from = "/about/"
	to = "/"
	status = 301

[[redirects]]
	from = "/*"
	to = "/404.html"
	status = 404
